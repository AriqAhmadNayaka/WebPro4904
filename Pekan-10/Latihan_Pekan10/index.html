<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Toko</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Sistem Monitoring Produk</h1>

        <h2>1. Daftar Semua Produk</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nama Produk</th>
                    <th>Harga</th>
                    <th>Stok</th>
                </tr>
            </thead>
            <tbody id="tabel-semua-produk">
            </tbody>
        </table>

        <h2>2. Daftar Produk Tersedia</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nama Produk</th>
                    <th>Harga</th>
                    <th>Stok</th>
                </tr>
            </thead>
            <tbody id="tabel-produk-tersedia">
            </tbody>
        </table>

        <h2>3. Daftar Nama Produk Tersedia</h2>
        <ul id="list-nama-produk">
        </ul>

        <h2>4. Total Aset Toko</h2>
        <div class="card">
            Total nilai seluruh barang (Harga x Stok): <br>
            <span class="highlight" id="total-aset"></span>
        </div>

        <h2>5. Update Harga</h2>
        <div class="card" id="demo-immutability">
        </div>
    </div>
    <script src="script.js">
    </script>
</body>
</html>
